[package]
name = "imagegen"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Standalone CLI companion for Codex-authenticated OpenAI image generation"

[dependencies]
anyhow = "1.0.98"
base64 = "0.22.1"
clap = { version = "4.5.40", features = ["derive"] }
http = "1.3.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.45.1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
toml = "0.8.23"

codex-api = { git = "https://github.com/openai/codex", rev = "dfd03ea01bbec2613013b477fb82abc67534a7d7", package = "codex-api" }
codex-client = { git = "https://github.com/openai/codex", rev = "dfd03ea01bbec2613013b477fb82abc67534a7d7", package = "codex-client" }
codex-login = { git = "https://github.com/openai/codex", rev = "dfd03ea01bbec2613013b477fb82abc67534a7d7", package = "codex-login" }
codex-model-provider = { git = "https://github.com/openai/codex", rev = "dfd03ea01bbec2613013b477fb82abc67534a7d7", package = "codex-model-provider" }
codex-model-provider-info = { git = "https://github.com/openai/codex", rev = "dfd03ea01bbec2613013b477fb82abc67534a7d7", package = "codex-model-provider-info" }
codex-protocol = { git = "https://github.com/openai/codex", rev = "dfd03ea01bbec2613013b477fb82abc67534a7d7", package = "codex-protocol" }

[dev-dependencies]
pretty_assertions = "1.4.1"

[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "132f5b39c862e3a970f731d709608b3e6276d5f6" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "9200079d3b54a1ff51072e24d81fd354f085156f" }
